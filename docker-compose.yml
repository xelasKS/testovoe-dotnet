services:
  postgres:
    image: postgres:16
    container_name: clientcommissions-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: clientcommissions-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: clientcommissions-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic commission-payouts --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic commission-payouts-dlq --partitions 3 --replication-factor 1
        echo "topics ready"
    restart: "no"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    container_name: clientcommissions-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COMMISSIONS_CONNECTION: "Host=postgres;Port=5432;Database=clientcommissions;Username=postgres;Password=postgres"
      USERS_CONNECTION: "Host=postgres;Port=5432;Database=clientcommissions_users;Username=postgres;Password=postgres"
      WALLET_CONNECTION: "Host=postgres;Port=5432;Database=clientcommissions_wallet;Username=postgres;Password=postgres"
    restart: "no"

  users:
    build:
      context: .
      dockerfile: Dockerfile.users
    container_name: clientcommissions-users
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=clientcommissions_users;Username=postgres;Password=postgres"
    ports:
      - "5097:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  commissions:
    build:
      context: .
      dockerfile: Dockerfile.commissions
    container_name: clientcommissions-commissions
    depends_on:
      migrator:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      users:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=clientcommissions;Username=postgres;Password=postgres"
      Services__Users: "http://users:8080"
      Kafka__BootstrapServers: "kafka:29092"
      Kafka__PayoutTopic: "commission-payouts"
    ports:
      - "5031:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  wallet:
    build:
      context: .
      dockerfile: Dockerfile.wallet
    container_name: clientcommissions-wallet
    depends_on:
      migrator:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=clientcommissions_wallet;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Kafka__PayoutTopic: "commission-payouts"
      Kafka__DlqTopic: "commission-payouts-dlq"
      Kafka__ConsumerGroup: "wallet"
    ports:
      - "5141:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: clientcommissions-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - commissions
      - users
      - wallet

  grafana:
    image: grafana/grafana:11.2.0
    container_name: clientcommissions-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres-data:
